<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>신고 검토 · D205</title>
<!--
  운영자용 신고 검토 화면.

  Thymeleaf 를 쓰지 않습니다. /api/v1/admin/reports 가 이미 JSON 을 주므로, 서버가
  HTML 까지 만들면 같은 데이터를 두 벌로 내보내게 됩니다.

  프레임워크도 빌드 도구도 없습니다. 화면이 셋뿐인데(로그인 · 목록 · 상세) node 와
  번들러와 별도 배포 대상이 따라옵니다. 화면이 커지면 그때 옮기면 됩니다.

  이 파일은 jar 에 같이 들어가고 nginx 가 / 를 8080 으로 넘기므로
  j15d205.p.ssafy.io/admin/ 에서 열립니다. 같은 출처라 CORS 설정이 없고 세션 쿠키가
  그대로 붙습니다.
-->
<style>
  :root {
    --ink: #1b1d21;
    --muted: #6b7280;
    --line: #e5e7eb;
    --bg: #f7f8fa;
    --card: #ffffff;
    --warn: #b91c1c;
    --ok: #15803d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    font: 15px/1.6 "Pretendard", -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    color: var(--ink); background: var(--bg);
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px; margin-bottom: 12px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input {
    width: 100%; padding: 9px 11px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 7px; margin-bottom: 12px;
  }
  button {
    font: inherit; padding: 8px 14px; border-radius: 7px;
    border: 1px solid var(--line); background: #fff; cursor: pointer;
  }
  button:hover { background: #f3f4f6; }
  button.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.primary:hover { background: #33363c; }
  button:disabled { opacity: .5; cursor: default; }
  .row {
    display: flex; align-items: center; gap: 14px;
    padding: 14px 0; border-bottom: 1px solid var(--line);
  }
  .row:last-child { border-bottom: 0; }
  .who { flex: 1; min-width: 0; }
  .nick { font-weight: 600; }
  .counts { font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* 건수와 사람 수를 나란히 붙여 둡니다. 이 둘의 대비가 이 화면의 전부입니다 -
     "3건 1명"은 신고한 쪽이, "7건 5명"은 신고당한 쪽이 의심스럽다는 뜻입니다. */
  .counts b { font-size: 17px; }
  .counts .people { color: var(--muted); }
  .reasons { color: var(--muted); font-size: 13px; }
  .deleted { color: var(--warn); font-size: 12px; }
  .when { color: var(--muted); font-size: 12px; white-space: nowrap; }
  .actions { display: flex; gap: 6px; }
  .detail {
    margin: 10px 0 4px; padding: 12px 14px;
    background: var(--bg); border-radius: 8px; font-size: 14px;
  }
  .detail div { padding: 5px 0; border-bottom: 1px solid var(--line); }
  .detail div:last-child { border-bottom: 0; }
  .memo { color: var(--muted); }
  .notice { padding: 10px 12px; border-radius: 7px; font-size: 14px; margin-bottom: 12px; }
  .notice.bad { background: #fef2f2; color: var(--warn); }
  .notice.good { background: #f0fdf4; color: var(--ok); }
  .empty { color: var(--muted); padding: 28px 0; text-align: center; }
  .warnbar {
    background: #fffbeb; border: 1px solid #fde68a; color: #92400e;
    padding: 10px 12px; border-radius: 7px; font-size: 13px; margin-bottom: 16px;
  }
  .tag {
    font-size: 11px; padding: 1px 6px; border-radius: 4px;
    background: var(--line); color: var(--muted); margin-left: 6px;
  }
  .bar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .bar select { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px; font: inherit; }
  .grow { flex: 1; }
  .tabs { display: flex; align-items: center; gap: 6px; margin-bottom: 14px; }
  /* 지금 보고 있는 탭이 눌린 것처럼 보여야 합니다. 색만 다르면 어느 쪽이 켜진
     것인지 화면을 처음 보는 사람이 알 수 없습니다. */
  .tab.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .tab.on:hover { background: #33363c; }
  /* 피드백 한 건은 줄 하나가 아니라 덩어리입니다. 500자까지 오고 줄바꿈이 들어
     있으므로, 신고 줄처럼 가로로 늘어놓으면 읽을 수 없습니다. */
  .feedback { display: block; }
  .feedback .msg {
    margin-top: 6px; padding: 10px 12px; background: var(--bg);
    border-radius: 8px; white-space: pre-wrap; word-break: break-word;
  }
  .feedback .head { display: flex; align-items: baseline; gap: 8px; }
  .feedback .meta { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .id { color: var(--muted); font-size: 12px; font-family: ui-monospace, monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <h1 id="pageTitle">신고 검토</h1>
  <div class="sub" id="who">확인하는 중…</div>

  <div id="notice" class="notice" hidden></div>

  <!-- 로그인 -->
  <div class="card" id="loginCard" hidden>
    <form id="loginForm">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="primary" type="submit">로그인</button>
    </form>
  </div>

  <!-- 로그인한 뒤 보이는 것. 탭 둘이 이 안에서 갈립니다. -->
  <div id="listView" hidden>
    <div class="tabs">
      <button id="tabReports" class="tab on" type="button">신고 검토</button>
      <button id="tabFeedback" class="tab" type="button">피드백</button>
      <span class="grow"></span>
      <button id="logout">로그아웃</button>
    </div>

    <!-- 신고 -->
    <div id="reportsView">
      <!--
        버튼이 무엇을 하는지 화면이 직접 말해야 합니다. "조치"라고만 적혀 있으면 운영자는
        누르는 순간 상대가 정지된 줄 압니다. 실제로는 신고에 표시만 남습니다.
      -->
      <div class="warnbar">
        표시만 남습니다. <b>계정 정지나 접속 차단 기능은 아직 없습니다.</b>
        신고당한 사람은 아무것도 알지 못합니다.
      </div>
      <div class="bar">
        <select id="status">
          <option value="PENDING">아직 안 본 신고</option>
          <option value="ACTIONED">문제 있다고 본 것</option>
          <option value="DISMISSED">문제 없다고 본 것</option>
        </select>
        <button id="refresh">새로고침</button>
      </div>
      <div class="card"><div id="rows"></div></div>
    </div>

    <!-- 피드백 -->
    <div id="feedbackView" hidden>
      <!--
        신고와 다른 사실을 적습니다. 여기서 할 수 있는 일은 읽는 것뿐이고, 그것을
        말해 두지 않으면 운영자가 답장이 가는 줄 알고 답을 씁니다.
      -->
      <div class="warnbar">
        읽는 것이 전부입니다. <b>답장할 경로가 없습니다.</b>
        읽음 표시도 없습니다 — 처리한 척하게 되기 때문입니다.
      </div>
      <div class="bar">
        <select id="limit">
          <option value="50">최근 50건</option>
          <option value="100">최근 100건</option>
          <option value="200">최근 200건</option>
        </select>
        <button id="refreshFeedback">새로고침</button>
      </div>
      <div class="card"><div id="feedbackRows"></div></div>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  const API = '/api/v1/admin';
  const el = (id) => document.getElementById(id);

  /**
   * 서버가 준 CSRF 토큰. 쿠키에서 읽어 헤더에 그대로 넣습니다.
   *
   * 서버가 섞지 않는 핸들러를 쓰도록 맞춰 두었습니다(SecurityConfig.rawCookieValue).
   * 기본 설정이면 쿠키 값과 서버가 기대하는 값이 달라 이 화면의 모든 처리 요청이
   * 403 이 됩니다.
   */
  function csrf() {
    const hit = document.cookie.split('; ').find((c) => c.startsWith('XSRF-TOKEN='));
    return hit ? decodeURIComponent(hit.slice('XSRF-TOKEN='.length)) : '';
  }

  function say(text, kind) {
    const box = el('notice');
    box.textContent = text;
    box.className = 'notice ' + (kind || 'bad');
    box.hidden = !text;
  }

  /** yyyyMMddHHmmss(UTC) 를 이 브라우저의 시각으로 읽습니다. */
  function when(stamp) {
    if (!stamp || stamp.length !== 14) return '';
    const iso = stamp.slice(0, 4) + '-' + stamp.slice(4, 6) + '-' + stamp.slice(6, 8)
      + 'T' + stamp.slice(8, 10) + ':' + stamp.slice(10, 12) + ':' + stamp.slice(12, 14) + 'Z';
    const at = new Date(iso);
    const ago = Math.floor((Date.now() - at.getTime()) / 60000);
    if (ago < 1) return '방금';
    if (ago < 60) return ago + '분 전';
    if (ago < 1440) return Math.floor(ago / 60) + '시간 전';
    return at.toLocaleDateString('ko-KR');
  }

  async function call(path, options) {
    const res = await fetch(API + path, Object.assign({
      headers: { 'X-XSRF-TOKEN': csrf(), 'Content-Type': 'application/json' },
    }, options));

    if (res.status === 401) {
      showLogin('로그인이 필요합니다.');
      throw new Error('unauthenticated');
    }

    // 403 은 CSRF 문제이기도 하고, 세션이 끊긴 상태이기도 합니다. CsrfFilter 가
    // 인가보다 먼저 돌아서, 로그인하지 않은 처리 요청은 401 이 아니라 여기로 옵니다.
    // 그래서 CSRF 문제로만 다루면 세션이 끊긴 사람이 로그인 화면에 못 갑니다.
    // 세션을 한 번 물어보고 갈라냅니다.
    if (res.status === 403) {
      const alive = await fetch(API + '/session');
      if (!alive.ok) {
        showLogin('로그인이 풀렸습니다. 다시 로그인해 주세요.');
      } else {
        say('요청이 거절되었습니다. 새로고침하고 다시 눌러 주세요.');
      }
      throw new Error('forbidden');
    }

    if (!res.ok) {
      let message = '요청을 처리하지 못했습니다.';
      try {
        const body = await res.json();
        if (body && body.message) message = body.message;
      } catch (ignored) { /* 본문이 없거나 JSON 이 아닐 수 있습니다. */ }
      say(message);
      throw new Error('failed');
    }

    return res.status === 204 ? null : res.json();
  }

  function showLogin(message) {
    el('who').textContent = '';
    el('loginCard').hidden = false;
    el('listView').hidden = true;
    if (message) say(message);
  }

  function showList(username) {
    el('who').textContent = username + ' 으로 로그인함';
    el('loginCard').hidden = true;
    el('listView').hidden = false;
  }

  function render(users) {
    const box = el('rows');
    box.textContent = '';

    if (!users.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '볼 신고가 없습니다.';
      box.appendChild(empty);
      return;
    }

    for (const user of users) {
      box.appendChild(rowOf(user));
    }
  }

  function rowOf(user) {
    const row = document.createElement('div');
    row.className = 'row';

    const who = document.createElement('div');
    who.className = 'who';

    const nick = document.createElement('div');
    nick.className = 'nick';
    nick.textContent = user.nickname;
    who.appendChild(nick);

    const reasons = document.createElement('div');
    reasons.className = 'reasons';
    reasons.textContent = Object.entries(user.reasons)
      .map(([name, count]) => name + ' ' + count).join(' · ');
    who.appendChild(reasons);

    if (user.fromDeletedAccounts > 0) {
      const gone = document.createElement('div');
      gone.className = 'deleted';
      // 몇 명이었는지는 복원할 수 없으므로 건수만 말합니다. 사람 수에 섞으면
      // 있지도 않은 신고자 수를 지어내게 됩니다.
      gone.textContent = '탈퇴한 계정의 신고 ' + user.fromDeletedAccounts + '건';
      who.appendChild(gone);
    }

    const counts = document.createElement('div');
    counts.className = 'counts';
    const total = document.createElement('b');
    total.textContent = user.reportCount + '건';
    const people = document.createElement('span');
    people.className = 'people';
    people.textContent = ' / ' + user.reporterCount + '명';
    counts.append(total, people);

    const time = document.createElement('div');
    time.className = 'when';
    time.textContent = when(user.lastReportedAt);

    const actions = document.createElement('div');
    actions.className = 'actions';

    const open = document.createElement('button');
    open.textContent = '내용';
    open.addEventListener('click', () => toggleDetail(row, user, open));
    actions.appendChild(open);

    if (el('status').value === 'PENDING') {
      // "조치"가 아니라 "문제 있음"입니다. 이 버튼은 제재를 실행하지 않고 판단만
      // 남깁니다. 실행하는 것처럼 적으면 운영자가 처리된 줄 알고 넘어갑니다.
      actions.appendChild(decide(user, 'ACTIONED', '문제 있음', true));
      actions.appendChild(decide(user, 'DISMISSED', '문제 없음', false));
    }

    row.append(who, counts, time, actions);
    return row;
  }

  function decide(user, status, label, primary) {
    const button = document.createElement('button');
    button.textContent = label;
    if (primary) button.className = 'primary';

    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const result = await call('/reports/' + encodeURIComponent(user.userId), {
          method: 'PATCH',
          body: JSON.stringify({ status: status }),
        });

        // 목록을 먼저 다시 그립니다. load 가 알림을 지우므로 순서가 반대면 방금 띄운
        // 문구가 그 자리에서 사라져, 운영자는 아무 확인도 받지 못합니다.
        await load();

        // 0 이면 그 사이에 다른 사람이 이미 처리한 것입니다. 오류가 아닙니다.
        say(result.reviewed > 0
          ? user.nickname + ' 신고 ' + result.reviewed + '건에 판단을 남겼습니다.'
          : '이미 판단이 남아 있었습니다.', 'good');
      } catch (ignored) {
        button.disabled = false;
      }
    });

    return button;
  }

  async function toggleDetail(row, user, button) {
    const open = row.nextElementSibling;
    if (open && open.classList.contains('detail')) {
      open.remove();
      button.textContent = '내용';
      return;
    }

    // 지금 보고 있는 상태만 펼칩니다. 미검토를 보다가 예전에 판단한 것까지 섞여
    // 나오면 지금 무엇을 정해야 하는지가 흐려집니다.
    const reports = (await call('/reports/' + encodeURIComponent(user.userId)
      + '?status=' + el('status').value)).reports;
    const box = document.createElement('div');
    box.className = 'detail';

    for (const report of reports) {
      const line = document.createElement('div');
      line.textContent = report.reason + ' · ' + when(report.createdAt);
      if (report.memo) {
        const memo = document.createElement('span');
        memo.className = 'memo';
        memo.textContent = ' — ' + report.memo;
        line.appendChild(memo);
      }
      box.appendChild(line);
    }

    row.after(box);
    button.textContent = '접기';
  }

  async function load() {
    say('');
    const status = el('status').value;
    render((await call('/reports?status=' + status)).users);
  }

  /**
   * 탭을 바꿉니다. 그리는 것은 부르는 쪽이 합니다.
   *
   * 어느 탭을 이미 읽었는지 기억하지 않습니다. 탭을 누를 때마다 다시 불러오면
   * "아까 본 목록"이 남아 있는 일이 없고, 이 화면의 조회는 둘 다 가볍습니다.
   */
  function showTab(name) {
    const reports = name === 'reports';
    el('reportsView').hidden = !reports;
    el('feedbackView').hidden = reports;
    el('tabReports').classList.toggle('on', reports);
    el('tabFeedback').classList.toggle('on', !reports);
    const name = reports ? '신고 검토' : '피드백';
    el('pageTitle').textContent = name;
    // 브라우저 탭 제목도 같이 바꿉니다. 창을 두 개 띄워 두면 제목이 유일한 구분입니다.
    document.title = name + ' · D205';
    say('');
  }

  async function loadFeedback() {
    say('');
    renderFeedback((await call('/feedback?limit=' + el('limit').value)).feedback);
  }

  function renderFeedback(items) {
    const box = el('feedbackRows');
    box.textContent = '';

    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '들어온 피드백이 없습니다.';
      box.appendChild(empty);
      return;
    }

    for (const item of items) {
      box.appendChild(feedbackRowOf(item));
    }
  }

  /**
   * 피드백 한 건.
   *
   * <b>본문은 플레이어가 쓴 글입니다.</b> 이 화면에서 남이 쓴 글이 들어오는 첫
   * 자리이고, textContent 로만 넣습니다. innerHTML 로 바꾸는 순간 게임의 피드백
   * 입력창이 이 화면에 스크립트를 넣는 통로가 됩니다.
   */
  function feedbackRowOf(item) {
    const row = document.createElement('div');
    row.className = 'row feedback';

    const head = document.createElement('div');
    head.className = 'head';

    const who = document.createElement('span');
    if (item.nickname) {
      who.className = 'nick';
      who.textContent = item.nickname;
    } else {
      // userId 와 nickname 은 함께 비어 옵니다(탈퇴 시 작성자만 지웁니다).
      // 빈 자리를 그냥 두면 닉네임이 없는 계정처럼 읽힙니다.
      who.className = 'deleted';
      who.textContent = '탈퇴한 계정';
    }
    head.appendChild(who);

    if (item.userId) {
      // 앞 여덟 자만 보여 줍니다. 36자를 그대로 놓으면 닉네임이 두 줄로 밀리고,
      // 운영자가 한 사람의 여러 건을 알아보는 데는 여덟 자로 충분합니다.
      // 전체 값은 마우스를 올리면 나오고, 그대로 복사해 신고 조회에 넣을 수 있습니다.
      const id = document.createElement('span');
      id.className = 'id';
      id.textContent = item.userId.slice(0, 8);
      id.title = item.userId;
      head.appendChild(id);
    }

    const grow = document.createElement('span');
    grow.className = 'grow';
    head.appendChild(grow);

    const at = document.createElement('span');
    at.className = 'when';
    at.textContent = when(item.createdAt);
    head.appendChild(at);

    row.appendChild(head);

    const message = document.createElement('div');
    message.className = 'msg';
    message.textContent = item.message;
    row.appendChild(message);

    // 빌드와 플랫폼이 없으면 그 줄을 아예 두지 않습니다. "빌드: -" 는 값이 없다는
    // 사실을 말하지 않고 자리만 차지합니다.
    const context = [item.buildVer, item.platform].filter(Boolean).join(' · ');
    if (context) {
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = context;
      row.appendChild(meta);
    }

    return row;
  }

  el('loginForm').addEventListener('submit', async (event) => {
    event.preventDefault();
    say('');

    // 폼 형식으로 보냅니다. Spring Security 의 필터가 직접 받기 때문입니다.
    // JSON 으로 보내면 아이디도 비밀번호도 읽히지 않아 조용히 401 이 됩니다.
    const body = new URLSearchParams({
      username: el('username').value,
      password: el('password').value,
    });

    const res = await fetch(API + '/session', { method: 'POST', body: body });
    if (!res.ok) {
      say('아이디 또는 비밀번호가 맞지 않습니다.');
      return;
    }

    el('password').value = '';
    await start();
  });

  el('logout').addEventListener('click', async () => {
    await fetch(API + '/logout', { method: 'POST', headers: { 'X-XSRF-TOKEN': csrf() } });
    showLogin('로그아웃했습니다.');
  });

  el('refresh').addEventListener('click', () => load().catch(() => {}));
  el('status').addEventListener('change', () => load().catch(() => {}));

  el('tabReports').addEventListener('click', () => {
    showTab('reports');
    load().catch(() => {});
  });

  el('tabFeedback').addEventListener('click', () => {
    showTab('feedback');
    loadFeedback().catch(() => {});
  });

  el('refreshFeedback').addEventListener('click', () => loadFeedback().catch(() => {}));
  el('limit').addEventListener('change', () => loadFeedback().catch(() => {}));

  async function start() {
    const res = await fetch(API + '/session');
    if (!res.ok) {
      showLogin('');
      return;
    }

    showList((await res.json()).username);

    // 신고로 시작합니다. 운영자가 여는 이유의 대부분이 그쪽이고, 피드백은 눌러서
    // 갑니다. 로그인할 때마다 마지막에 본 탭을 기억하게 하려면 저장할 곳이 필요한데
    // 그만한 값은 아닙니다.
    showTab('reports');
    await load();
  }

  start().catch(() => showLogin(''));
})();
</script>
</body>
</html>
