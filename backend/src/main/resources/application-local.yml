# 로컬 개발용. 여기 적힌 계정은 compose.local.yml이 띄우는 컨테이너 전용이며
# 개발자 PC 밖으로 나가지 않으므로 저장소에 그대로 둡니다.
spring:
  datasource:
    # 3307입니다. compose.local.yml이 호스트 3307에 물려 있습니다.
    url: jdbc:mysql://localhost:3307/d205?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: d205
    password: d205local

  jpa:
    show-sql: true

# 분석 DB. 같은 컨테이너, 같은 계정, 다른 스키마입니다. createDatabaseIfNotExist 가 첫 접속에서
# 스키마를 만들고 Flyway 가 테이블을 만듭니다. 계정에 그 권한이 있어야 하는데, 그건
# compose.local.yml 이 마운트하는 deploy/mysql/init 스크립트가 줍니다.
# serverTimezone 이 게임 DB(Asia/Seoul)와 다른 UTC 인 것은 의도입니다. game_event 의 DATETIME 은
# 전부 UTC 라고 명세가 정했습니다.
analytics:
  datasource:
    url: jdbc:mysql://localhost:3307/d205_analytics?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
    username: d205
    password: d205local

logging:
  level:
    com.ssafy.d205: debug
    org.hibernate.SQL: debug

# 로컬에서만 켭니다. http://localhost:8080/swagger-ui.html
# 여기서 누르는 요청은 compose.local.yml 이 띄운 컨테이너에만 씁니다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 로컬 전용 관리자 계정. 위 datasource 와 같은 판단입니다 - 개발자 PC 밖으로 나가지
# 않으므로 저장소에 둡니다. 운영은 .env 의 ADMIN_USERNAME / ADMIN_PASSWORD 를 씁니다.
admin:
  username: admin
  password: local-only
