# 운영용. 접속 정보는 값을 적지 않고 환경변수로만 받습니다.
# 기본값을 두지 않는 이유: 변수가 빠진 채 배포되면 조용히 엉뚱한 DB에 붙는 대신
# 기동이 실패해서 즉시 드러나야 하기 때문입니다.
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    show-sql: false

# 분석 DB. 게임 DB 와 같은 인스턴스·계정이고 스키마만 d205_analytics 입니다. .env 에 새 변수는
# 없습니다. 계정에 이 스키마 권한이 있어야 하는데 운영 볼륨은 이미 초기화돼 있어 initdb
# 스크립트가 돌지 않으므로, deploy/README.md 의 GRANT 를 배포 전에 한 번 실행해야 합니다.
# 권한이 없으면 앱은 뜨고 이벤트만 버려지며 ERROR 로그가 30초마다 남습니다.
analytics:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/d205_analytics?createDatabaseIfNotExist=true&characterEncoding=UTF-8&serverTimezone=UTC&rewriteBatchedStatements=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        # nginx 가 80 을 443 으로 넘기지만, 그 리다이렉트를 받는 요청 자체는 평문으로
        # 한 번 갑니다. 이 값이 없으면 그때 세션 쿠키가 함께 실려 나갑니다.
        secure: true
  # nginx가 443에서 받아 프록시하므로 X-Forwarded-* 를 신뢰해야 합니다.
  # 없으면 Spring이 만드는 리다이렉트와 절대 URL이 http://localhost:8080
  # 으로 새어나갑니다. 지금은 그런 엔드포인트가 없지만 로그인을 붙일 때
  # 반드시 걸립니다.
  forward-headers-strategy: native

logging:
  level:
    root: info
    com.ssafy.d205: info

# springdoc 설정을 여기 적지 않은 것은 빠뜨린 게 아닙니다. application.yml 에서
# 이미 꺼져 있고, 여기에 같은 값을 또 적으면 두 곳이 어긋날 수 있습니다.
# 인증을 붙인 뒤에 운영 노출을 다시 판단합니다.
