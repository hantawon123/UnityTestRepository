# 테스트 프로필 설정.
#
# 접속 상태 스윕을 사실상 끕니다. 스케줄러가 테스트 중에 돌면 하트비트를 과거로 밀어
# 크래시 상황을 만드는 테스트와 경합합니다. 저장된 status 가 아직 IN_GAME 인 것을
# 확인하는 사이에 스윕이 OFFLINE 으로 바꿔버리면 간헐적으로 실패하고, 그때 원인을
# 찾기가 어렵습니다.
#
# fixedDelay 는 기동 직후 한 번 돌고 그다음 이 간격을 셉니다. 기동 시점에는 데이터가
# 없어서 해가 없고, 한 시간 뒤에는 테스트가 이미 끝나 있습니다.
#
# 스윕 자체를 검증하는 테스트는 sweep() 을 직접 부르므로 이 설정과 무관합니다.
presence:
  sweep-interval-ms: 3600000

# 초대 스윕도 같은 이유로 끕니다. 초대를 과거로 밀어 만료를 재현하는 테스트가
# 스윕과 겹치면, 만료된 초대가 목록에서 빠지는 것을 확인하려는 사이에 스윕이 행을
# 지워버려 무엇을 검증했는지 알 수 없게 됩니다.
invite:
  sweep-interval-ms: 3600000

# OpenApiSpecTest 가 읽습니다. UI 까지 켜는 것은 로컬 설정(application-local.yml)이
# 실제로 동작하는지 검증하기 위한 것입니다. 경로 설정이 틀리면 아무 오류 없이 404 가
# 되어서, 클라이언트 담당자가 열어볼 때까지 아무도 모릅니다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

# 인증을 시험하려면 계정이 있어야 합니다. 값이 없으면 계정이 등록되지 않아
# 로그인 테스트가 "비밀번호가 틀렸다"가 아니라 "계정이 없다"로 실패하는데,
# 둘은 응답이 같아서 무엇이 잘못됐는지 알 수 없습니다.
admin:
  username: test-admin
  password: test-password

# 플레이 로그 큐를 자주 비웁니다. 기본 1초를 기다리는 테스트가 여럿 쌓이면 스위트가 느려집니다.
#
# 접속 정보는 IntegrationTest 가 컨테이너에서 받아 test.analytics.* 에 넣고 여기서 참조합니다.
# 한 단계 우회하는 이유는 IntegrationTest 의 주석에 있습니다. 분석 DB 장애를 시험하는 테스트가
# 이 값만 @TestPropertySource 로 덮어씁니다.
analytics:
  flush-interval-ms: 200
  datasource:
    url: ${test.analytics.url}
    username: ${test.analytics.username}
    password: ${test.analytics.password}
