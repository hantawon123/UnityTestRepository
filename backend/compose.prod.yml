# 운영 서버(j15d205)용입니다. 접속 정보는 이 파일에 적지 않고
# 같은 디렉터리의 .env에서 읽습니다. .env는 서버에만 있고 저장소에 없습니다.

name: d205

services:
  mysql:
    image: mysql:8.4
    container_name: d205-mysql
    restart: unless-stopped
    environment:
      # :? 를 붙여서 변수가 비면 기동 자체를 막습니다. 빈 비밀번호로
      # DB가 떠버리는 것보다 시작을 못 하는 편이 안전합니다.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${DB_NAME:?}
      MYSQL_USER: ${DB_USERNAME:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      TZ: Asia/Seoul
    # 닉네임에 한글과 이모지가 들어올 수 있어 utf8mb4로 고정합니다.
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    # 호스트 포트를 열지 않습니다. DB는 compose 네트워크 안에서
    # app만 접근하면 되고, 밖에 노출하면 그 순간 공격 대상이 됩니다.
    volumes:
      - d205-mysql-data:/var/lib/mysql
    healthcheck:
      # 컨테이너가 떴다는 것과 DB가 질의를 받을 수 있다는 것은 다릅니다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: d205-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # 컨테이너 이름이 곧 호스트명입니다. localhost가 아닙니다.
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?}
      DB_USERNAME: ${DB_USERNAME:?}
      DB_PASSWORD: ${DB_PASSWORD:?}
      # 관리자 계정. 위 DB 변수들과 달리 :? 를 붙이지 않습니다. 값이 없으면 관리
      # API 만 쓸 수 없고 게임은 정상으로 돌기 때문에, 기동을 막는 것은 과합니다.
      # 반대로 DB 접속 정보는 없으면 서버가 아무것도 못 하므로 기동을 막습니다.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TZ: Asia/Seoul
    depends_on:
      mysql:
        # 단순 기동이 아니라 healthcheck 통과를 기다립니다. Flyway가
        # DB보다 먼저 붙으면 마이그레이션이 실패한 채로 죽습니다.
        condition: service_healthy
    ports:
      # 루프백에만 바인딩합니다. nginx가 443에서 받아 프록시하므로 앱을
      # 인터넷에 직접 노출할 이유가 없습니다.
      #
      # 이 변경이 Docker의 ufw 우회 문제도 함께 해결합니다. 0.0.0.0으로
      # publish하면 Docker가 ufw보다 먼저 평가되는 규칙을 넣어 방화벽이
      # 무력화되지만, 루프백 바인딩은 우회할 대상 자체가 없습니다.
      - "127.0.0.1:8080:8080"

  # 대시보드. 기획·개발이 SQL 없이 브라우저에서 플레이 로그를 봅니다(S15P21D205-805).
  #
  # 자기 설정(대시보드, 사용자)은 내장 H2 가 아니라 d205-mysql 의 metabase 스키마에 둡니다.
  # H2 는 컨테이너 파일시스템에 있어서 컨테이너를 다시 만들면 대시보드가 통째로 사라집니다.
  # 그 스키마와 계정은 deploy/mysql/init/02-analytics-accounts.sh 가 만듭니다. 운영 볼륨은 이미
  # 초기화돼 있어 deploy/README.md 대로 사람이 한 번 실행해야 합니다.
  #
  # 데이터를 읽는 계정(d205_reader)은 여기 없습니다. 그건 Metabase 화면에서 "데이터베이스 추가"로
  # 넣는 값이고 Metabase 가 자기 스키마에 저장합니다.
  #
  # 하위 경로(/analytics/)가 아니라 8443 포트로 나가는 이유는 deploy/nginx/d205.conf 에 있습니다.
  # MB_SITE_URL 은 Metabase 가 이메일 링크나 공유 링크를 만들 때 쓰는 자기 주소입니다.
  metabase:
    image: metabase/metabase:v0.63.16.6
    container_name: d205-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: mysql
      # 호스트·포트·DB 를 따로 주지 않고 URI 로 주는 이유는 allowPublicKeyRetrieval 때문입니다.
      #
      # MySQL 8.4 계정의 기본 인증은 caching_sha2_password 인데, Metabase 가 쓰는 MariaDB 드라이버는
      # 암호화되지 않은 연결에서 그 방식으로 붙으려면 서버 공개키를 받아 와야 하고 기본값은 그걸
      # 거부합니다. 그러면 로그에 원인 없이 "Unable to connect to Metabase mysql DB" 만 남기고 죽어
      # 재시작을 반복합니다. 2026-09-07 첫 배포가 그랬고, 로컬에서 같은 조합으로 재현한 뒤 이
      # 옵션 하나로 붙는 것을 확인했습니다. Spring 앱이 같은 MySQL 에 문제없이 붙는 것은 드라이버가
      # 달라서(Connector/J 는 TLS 를 기본으로 켬) 이 함정이 없기 때문입니다.
      #
      # compose 네트워크 안의 평문 연결이라 공개키 요청을 허용해도 노출되는 것이 없습니다.
      # 비밀번호는 URI 에 넣지 않고 MB_DB_USER/MB_DB_PASS 로 따로 줍니다. Metabase 가 둘의 조합을
      # 지원하고, URI 에 넣으면 특수문자를 인코딩해야 하며 로그에 남을 수 있습니다.
      MB_DB_CONNECTION_URI: mysql://mysql:3306/metabase?allowPublicKeyRetrieval=true
      MB_DB_USER: metabase
      # :? 입니다. 이 값이 .env 에 없으면 compose 파싱 단계에서 멈추므로, 배포 전에 .env 에
      # 넣어야 합니다. 빈 비밀번호로 뜨는 것보다 배포가 막히는 편이 낫다는 판단은 DB 변수와 같습니다.
      # 여기서 .env 는 서버 파일이 아니라 Jenkins 의 비밀 파일(d205-backend-env)입니다. 둘을 같이 갱신하세요.
      MB_DB_PASS: ${METABASE_DB_PASSWORD:?}
      MB_SITE_URL: https://j15d205.p.ssafy.io:8443
      # 힙 상한. EC2 15GB 에 Jenkins 실행기 2개와 MySQL, 앱이 같이 있습니다. 상한 없이 두면
      # 컨테이너 기본값이 호스트 메모리의 큰 몫을 잡습니다.
      JAVA_OPTS: -Xmx1g
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # 앱과 같은 원칙으로 루프백에만 바인딩합니다. nginx 가 8443 에서 받아 프록시합니다.
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      # 첫 기동은 마이그레이션 때문에 1분 넘게 걸립니다. 그 전에 실패로 보면 restart 가 반복됩니다.
      start_period: 180s

volumes:
  d205-mysql-data:
