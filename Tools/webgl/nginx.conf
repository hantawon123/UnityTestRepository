# Include inside the existing HTTPS server block. Keep API/Jenkins locations unchanged.
# Publish a complete release under /var/www/d205-webgl/releases/<commit>/ first.
location = /play {
    return 302 /play/;
}

location /play/ {
    alias /var/www/d205-webgl/site/;
    index index.html;
    add_header Cache-Control "no-cache" always;
}

location = /play/current.json {
    alias /var/www/d205-webgl/current.json;
    default_type application/json;
    add_header Cache-Control "no-store" always;
}

# Versioned URLs keep an already open game on its original release.
location /play/releases/ {
    alias /var/www/d205-webgl/releases/;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ "^/play/releases/([a-f0-9]{40})/(Build/[^/]+\.wasm\.gz)$" {
    alias /var/www/d205-webgl/releases/$1/$2;
    default_type application/wasm;
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ "^/play/releases/([a-f0-9]{40})/(Build/[^/]+\.js\.gz)$" {
    alias /var/www/d205-webgl/releases/$1/$2;
    default_type application/javascript;
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location ~ "^/play/releases/([a-f0-9]{40})/(Build/[^/]+\.data\.gz)$" {
    alias /var/www/d205-webgl/releases/$1/$2;
    default_type application/octet-stream;
    add_header Content-Encoding gzip;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
